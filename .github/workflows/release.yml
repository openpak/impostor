name: release

# Tag openpak-v<upstream version> and this publishes ghcr.io/openpak/impostor for amd64 and
# arm64 from upstream's own Dockerfile. The code is upstream's, unmodified (GPL-3.0); OpenPak
# only builds and hosts it. Upstream's v* tags keep their meaning.
on:
  push:
    tags: ['openpak-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/openpak/impostor
          tags: |
            type=match,pattern=openpak-v(.*),group=1
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSIONSUFFIX=openpak
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
